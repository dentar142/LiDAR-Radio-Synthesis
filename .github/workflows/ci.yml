name: ci

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[runtime,radio-core,test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify built wheel imports
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import os,tempfile; os.chdir(tempfile.mkdtemp()); import src; print(src.__file__)"
      - name: Verify safe release archive
        run: python tools/build_release.py --output-dir release
