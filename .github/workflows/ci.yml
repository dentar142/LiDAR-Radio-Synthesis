name: scaffold-ci

on:
  push:
  pull_request:

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q src tests tools
      - run: python tools/run_stage.py --config config/example_scene.yaml --stage all
