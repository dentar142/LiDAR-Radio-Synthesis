[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkustgz-material-mapping"
version = "0.1.0"
description = "Method scaffold for constrained building geometry and material mapping"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
runtime = ["numpy", "pyyaml", "trimesh", "open3d", "shapely", "pyproj"]
test = ["pytest", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "."}
